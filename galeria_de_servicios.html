<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Dentales</title>
    <link rel="stylesheet" href="./css/dising.css">
</head>
<body>

    <section class="servicios-container">
        <h2>Servicios Dentales</h2>
        
        <div class="galeria-grid">
            <a href="#img1" class="tarjeta-servicio">
                <img src="./imagenes/7.jpg" alt="Braqueteria">
                <p>Braqueteria</p>
            </a>
            
            <a href="#img2" class="tarjeta-servicio">
                <img src="./imagenes/8.jpg" alt="Limpieza Dental">
                <p>Limpieza Dental</p>
            </a>

            <a href="#img3" class="tarjeta-servicio">
                <img src="./imagenes/9.jpg" alt="Ortodoncia">
                <p>Ortodoncia</p>
            </a>
        </div>

       
        <div class="paginacion-numeros">
            <a href="#img1" class="btn-num">1</a>
            <a href="#img2" class="btn-num">2</a>
            <a href="#img3" class="btn-num">3</a>
        </div>
    </section>

    <div id="img1" class="modal-galeria">
        <div class="modal-contenido">
            <a href="#" class="btn-cerrar">&times;</a>
            <img src="./imagenes/7.jpg" alt="Braqueteria">
            <p>Tratamiento especializado de braqueteria y estética dental.</p>
        </div>
    </div>
   
    <div id="img2" class="modal-galeria">
        <div class="modal-contenido">
            <a href="#" class="btn-cerrar">&times;</a>
            <img src="./imagenes/8.jpg" alt="Limpieza Dental">
            <p>Brindamos atención personalizada y de calidad a nuestros pacientes.</p>
        </div>
    </div>
  
    <div id="img3" class="modal-galeria">
        <div class="modal-contenido">
            <a href="#" class="btn-cerrar">&times;</a>
            <img src="./imagenes/9.jpg" alt="Ortodoncia">
            <p>Aparatología avanzada para la corrección y salud de tu sonrisa.</p>
        </div>
    </div>

</body>
</html>
